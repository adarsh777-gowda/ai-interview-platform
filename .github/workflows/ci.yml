name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-interview-platform/package-lock.json

      - name: Install dependencies
        working-directory: ai-interview-platform
        run: npm install

      - name: Generate Prisma client
        working-directory: ai-interview-platform
        run: npx prisma generate

      - name: Run unit tests
        working-directory: ai-interview-platform
        run: npm test

      - name: Lint
        working-directory: ai-interview-platform
        run: npm run lint

      - name: Build
        working-directory: ai-interview-platform
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          AUTH_SECRET: ci-build-secret-placeholder-32chars
          OPENAI_API_KEY: sk-test
        run: npm run build
